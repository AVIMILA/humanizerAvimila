<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>humanizerAvimila</title>
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        h2 {
            color: #0078d4;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
        }
        button {
            background: #0078d4;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
            margin-bottom: 15px;
            font-weight: 600;
        }
        button:hover {
            background: #005a9e;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #btnInsert {
            background: #28a745;
        }
        #btnInsert:hover {
            background: #218838;
        }
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
            font-family: 'Segoe UI', sans-serif;
            box-sizing: border-box;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            display: none;
            font-size: 13px;
        }
        .loading {
            background: #fff3cd;
            color: #856404;
            display: block;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        .success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
    </style>
</head>
<body>
    <h2>✨ humanizerAvimila</h2>
    <p class="subtitle">Sélectionnez du texte dans Word et cliquez sur Humaniser</p>
    
    <button id="btnHumanize">🔄 Humaniser la sélection</button>
    
    <div id="status" class="status"></div>
    
    <textarea id="resultArea" placeholder="Le texte humanisé apparaîtra ici..." readonly></textarea>
    
    <button id="btnInsert">📝 Insérer dans Word</button>

    <script src="taskpane.js"></script>
</body>
</html>
